name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@stoutalligator"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --allow-build=@biomejs/biome --allow-build=esbuild

      - name: Set package version from tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Tag '$GITHUB_REF_NAME' does not match expected 'vX.Y.Z' format" && exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          cd packages/engine && npm version "$VERSION" --no-git-tag-version

      - name: Build
        run: pnpm --filter "@stoutalligator/engine" build

      - name: Publish to GitHub Packages
        run: pnpm --filter "@stoutalligator/engine" publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
